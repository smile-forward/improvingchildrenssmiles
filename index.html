<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restoring Smiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: "Times New Roman", serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
}

header {
  background: #cfe2ff;
  padding: 30px;
}

.header-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  text-align: center;
}

#logo {
  height: 90px;
  display: none;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

.button {
  background: #5c86cb;
  color: white;
  padding: 12px 22px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

footer {
  background: #eee;
  text-align: center;
  padding: 10px;
  font-size: 12px;
}

#admin-link {
  font-size: 11px;
  color: #999;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  font-family: "Times New Roman", serif;
}

.hidden { display: none; }
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <img id="logo" alt="Organization Logo">
    <div>
      <h1 id="title"></h1>
      <p id="org-text"></p>
    </div>
  </div>
</header>

<section>
<h2>Our Mission</h2>
<p id="mission"></p>
</section>

<section>
<h2>Why Oral Health Matters</h2>
<p id="why"></p>
</section>

<section>
<h2>Donate</h2>
<p id="donate-text"></p>
<a id="donate-button" href="#" target="_blank">
  <button class="button">Donate Now</button>
</a>
</section>

<section>
<h2>Have questions? Let us know!</h2>
<input id="q-name" placeholder="Name (Optional)">
<input id="q-email" placeholder="Your email">
<textarea id="q-text" placeholder="Your question"></textarea>
<button class="button" onclick="submitQuestion()">Send Question</button>
</section>

<!-- ADMIN -->
<div id="admin-area" class="hidden">
<section>
<h3>Admin Panel</h3>

<label>Upload Logo</label>
<input type="file" accept="image/*" onchange="previewLogo(event)">

<label>Donation Link</label>
<input id="donate-link">

<button class="button" onclick="saveChanges()">Save Changes</button>
</section>
</div>

<footer>
<p>© 2025 Smile Forward</p>
<span id="admin-link" onclick="adminLogin()">admin</span>
</footer>

<script>
/* =========================
   HARD DEFAULT CONTENT
   ========================= */

const DEFAULT_CONTENT = {
  title: "Restoring Smiles with Smile Forward",
  orgText: "A student based Non-Profit organization based in Mississauga promoting oral health awareness",
  mission:
    "For many people, brushing their teeth is a simple daily habit. However, for individuals experiencing homelessness, access to basic oral hygiene supplies is often unavailable. Without preventative care, minor dental issues can develop into painful infections that affect overall health, confidence, and dignity. Our mission is to bridge this gap by providing essential oral health kits that empower individuals to care for themselves.",
  why:
    "Oral health is deeply connected to overall physical and mental health. Poor oral hygiene has been linked to heart disease, diabetes, respiratory infections, and chronic pain. Addressing oral health means addressing overall well-being, confidence, and long-term quality of life.",
  donate:
    "Your support plays a vital role in restoring dignity and improving health for individuals experiencing homelessness. Every contribution helps provide essential oral hygiene supplies that prevent pain, infection, and long-term complications. Together, we can create healthier smiles and stronger communities."
};

/* =========================
   SAFE LOAD (NO UNDEFINED)
   ========================= */

function safeLoad(id, key) {
  const saved = localStorage.getItem(key);
  document.getElementById(id).innerText =
    (typeof saved === "string" && saved.trim() !== "")
      ? saved
      : DEFAULT_CONTENT[key];
}

window.onload = () => {
  safeLoad("title", "title");
  safeLoad("org-text", "orgText");
  safeLoad("mission", "mission");
  safeLoad("why", "why");
  safeLoad("donate-text", "donate");

  const logo = localStorage.getItem("logo");
  if (logo) {
    const img = document.getElementById("logo");
    img.src = logo;
    img.style.display = "block";
  }

  const link = localStorage.getItem("donateLink");
  if (link) document.getElementById("donate-button").href = link;
};

/* =========================
   ADMIN SYSTEM
   ========================= */

const PASSWORD = "admin123";
let draft = {};
let logoDraft = null;

function adminLogin() {
  if (prompt("Password") === PASSWORD) {
    document.getElementById("admin-area").classList.remove("hidden");
    enterAdmin();
  }
}

function enterAdmin() {
  ["title","org-text","mission","why","donate-text"].forEach(id => {
    const el = document.getElementById(id);
    draft[id] = el.innerText;
    el.innerHTML = `<textarea>${el.innerText}</textarea>`;
  });

  document.getElementById("donate-link").value =
    localStorage.getItem("donateLink") || "";
}

function saveChanges() {
  Object.keys(draft).forEach(id => {
    const textarea = document.querySelector(`#${id} textarea`);
    if (textarea && textarea.value.trim() !== "") {
      localStorage.setItem(
        id === "org-text" ? "orgText" :
        id === "donate-text" ? "donate" : id,
        textarea.value
      );
    }
  });

  if (logoDraft) localStorage.setItem("logo", logoDraft);
  localStorage.setItem("donateLink", document.getElementById("donate-link").value);

  location.reload();
}

function previewLogo(e) {
  const reader = new FileReader();
  reader.onload = () => {
    logoDraft = reader.result;
    const img = document.getElementById("logo");
    img.src = reader.result;
    img.style.display = "block";
  };
  reader.readAsDataURL(e.target.files[0]);
}

/* =========================
   QUESTIONS
   ========================= */

function submitQuestion() {
  const qs = JSON.parse(localStorage.getItem("questions") || "[]");
  qs.push({
    name: document.getElementById("q-name").value || "Anonymous",
    email: document.getElementById("q-email").value,
    question: document.getElementById("q-text").value
  });
  localStorage.setItem("questions", JSON.stringify(qs));
  alert("Question sent!");
}
</script>

</body>
</html>
