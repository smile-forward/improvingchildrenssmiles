<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restoring Smiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: "Times New Roman", serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
}

header {
  background: #cfe2ff;
  padding: 30px;
}

.header-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  text-align: center;
}

#logo {
  height: 90px;
  display: none;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

.button {
  background: #5c86cb;
  color: white;
  padding: 12px 22px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

footer {
  background: #eee;
  text-align: center;
  padding: 10px;
  font-size: 12px;
}

#admin-link {
  font-size: 11px;
  color: #999;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  font-family: "Times New Roman", serif;
}

.hidden { display: none; }

.image-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.image-row img {
  width: 30%;
  max-width: 250px;
}

.question-box {
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}

.question-box.viewed {
  background: #d4edda;
}

.editable-text {
  border: 1px dashed #999;
  padding: 5px;
  min-height: 20px;
}
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <img id="logo" alt="Organization Logo">
    <div>
      <h1 id="title"></h1>
      <p id="org-text"></p>
    </div>
  </div>
</header>

<!-- TOP IMAGES -->
<div id="top-images" class="image-row"></div>

<section>
<h2>Our Mission</h2>
<p id="mission"></p>
</section>

<section>
<h2>Why Oral Health Matters</h2>
<p id="why"></p>
</section>

<section>
<h2>Donate</h2>
<p id="donate-text"></p>
<a id="donate-button" href="#" target="_blank">
  <button class="button">Donate Now</button>
</a>
</section>

<section>
<h2>Have questions? Let us know!</h2>
<input id="q-name" placeholder="Name (Optional)">
<input id="q-email" placeholder="Your email">
<textarea id="q-text" placeholder="Your question"></textarea>
<button class="button" onclick="submitQuestion()">Send Question</button>
</section>

<!-- BOTTOM IMAGES -->
<div id="bottom-images" class="image-row"></div>

<!-- ADMIN PANEL -->
<div id="admin-area" class="hidden">
<section>
<h3>Admin Panel</h3>

<label>Upload Top Images (max 3)</label>
<input type="file" multiple accept="image/*" onchange="uploadImages(event,'top')">

<label>Upload Bottom Images (max 3)</label>
<input type="file" multiple accept="image/*" onchange="uploadImages(event,'bottom')">

<h4>Submitted Questions</h4>
<div id="admin-questions"></div>

<!-- DONATE LINK SECTION -->
<h4>Donate Button Link</h4>
<input id="donate-link-input" placeholder="Enter Donate URL">

<button class="button" onclick="saveChanges()">Save Changes</button>
</section>
</div>

<footer>
<p>© 2025 Smile Forward</p>
<span id="admin-link" onclick="adminLogin()">admin</span>
</footer>

<script>
const PASSWORD = "admin123";

/* DEFAULT TEXT */
const DEFAULT_CONTENT = {
  title: "Restoring Smiles with Smile Forward",
  orgText: "A student based Non-Profit organization based in Mississauga promoting oral health awareness",
  mission: "For many people, brushing their teeth is a simple daily habit—something done almost automatically, without a second thought. However, for individuals experiencing homelessness, access to basic oral hygiene supplies is often unavailable. Without preventative care, minor dental issues can develop into painful infections that affect overall health, confidence, and dignity. Our mission is to bridge this gap by providing essential oral health kits that empower individuals to care for themselves.",
  why: "Oral health is far more than just a bright smile—it is a critical component of overall physical and mental health. Poor oral hygiene has been linked to heart disease, diabetes, respiratory infections, and chronic inflammation. Addressing oral health means addressing overall well-being, confidence, and quality of life.",
  donate: "Your support plays a vital role in restoring dignity and improving health for individuals experiencing homelessness. Every donation directly contributes to providing essential oral hygiene supplies that help prevent pain, infection, and long-term complications. Together, we can create healthier smiles and stronger communities."
};

/* SAFE LOAD */
function loadText(id, key) {
  const saved = localStorage.getItem(key);
  document.getElementById(id).innerText = saved || DEFAULT_CONTENT[key];
}

function loadImages(position) {
  const data = JSON.parse(localStorage.getItem(position+"Images") || "[]");
  const container = document.getElementById(position+"-images");
  container.innerHTML = "";
  data.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    container.appendChild(img);
  });
}

window.onload = () => {
  loadText("title","title");
  loadText("org-text","orgText");
  loadText("mission","mission");
  loadText("why","why");
  loadText("donate-text","donate");

  loadImages("top");
  loadImages("bottom");

  const logo = localStorage.getItem("logo");
  if (logo) {
    document.getElementById("logo").src = logo;
    document.getElementById("logo").style.display = "block";
  }

  const link = localStorage.getItem("donateLink");
  if (link) {
    document.getElementById("donate-button").href = link;
    document.getElementById("donate-link-input").value = link; // pre-fill input
  }
};

/* ADMIN */
function adminLogin() {
  if (prompt("Password") === PASSWORD) {
    document.getElementById("admin-area").classList.remove("hidden");
    makeTextEditable();
    loadAdminQuestions();
  }
}

function makeTextEditable() {
  const editableIds = ["title","org-text","mission","why","donate-text"];
  editableIds.forEach(id => {
    const el = document.getElementById(id);
    const text = el.innerText;
    el.innerHTML = `<textarea class="editable-text" id="${id}-input">${text}</textarea>`;
  });
}

function uploadImages(e, position) {
  const files = Array.from(e.target.files).slice(0,3);
  const stored = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      stored.push(reader.result);
      localStorage.setItem(position+"Images", JSON.stringify(stored));
      loadImages(position);
    };
    reader.readAsDataURL(file);
  });
}

/* QUESTIONS */
function submitQuestion() {
  const qs = JSON.parse(localStorage.getItem("questions") || "[]");
  qs.push({
    name: document.getElementById("q-name").value || "Anonymous",
    email: document.getElementById("q-email").value,
    question: document.getElementById("q-text").value,
    viewed: false
  });
  localStorage.setItem("questions", JSON.stringify(qs));
  alert("Question sent!");
}

function loadAdminQuestions() {
  const qs = JSON.parse(localStorage.getItem("questions") || "[]");
  const box = document.getElementById("admin-questions");
  box.innerHTML = "";
  qs.forEach((q,i)=>{
    const div = document.createElement("div");
    div.className = "question-box" + (q.viewed ? " viewed":"");
    div.innerText = `${q.name}: ${q.question}`;
    div.onclick = () => {
      q.viewed = true;
      localStorage.setItem("questions", JSON.stringify(qs));
      loadAdminQuestions();
    };
    box.appendChild(div);
  });
}

/* SAVE CHANGES */
function saveChanges() {
  const editableIds = ["title","org-text","mission","why","donate-text"];
  editableIds.forEach(id => {
    const input = document.getElementById(id+"-input");
    const value = input ? input.value.trim() : "";
    if(value) {
      localStorage.setItem(id, value);
      document.getElementById(id).innerText = value;
    } else {
      // revert to previous/default if empty
      document.getElementById(id).innerText = localStorage.getItem(id) || DEFAULT_CONTENT[id];
    }
  });

  // save donate link
  const donateLink = document.getElementById("donate-link-input").value;
  if(donateLink) {
    localStorage.setItem("donateLink", donateLink);
    document.getElementById("donate-button").href = donateLink;
  }

  // remove textareas after saving
  editableIds.forEach(id => {
    const el = document.getElementById(id);
    if(el.querySelector("textarea")) {
      const text = el.querySelector("textarea").value;
      el.innerText = text || localStorage.getItem(id) || DEFAULT_CONTENT[id];
    }
  });

  location.reload();
}
</script>

</body>
</html>
