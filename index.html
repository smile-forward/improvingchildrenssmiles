<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restoring Smiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: "Times New Roman", serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
  font-size: 18px;
  line-height: 1.8;
}

header {
  background: #cfe2ff;
  padding: 40px;
}

.header-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  text-align: center;
}

#logo {
  height: 90px;
  display: none;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 25px;
}

.button {
  background: #5c86cb;
  color: white;
  padding: 14px 26px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

footer {
  background: #eee;
  text-align: center;
  padding: 12px;
  font-size: 13px;
}

#admin-link {
  font-size: 11px;
  color: #999;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  font-family: "Times New Roman", serif;
  font-size: 16px;
}

.hidden { display: none; }

/* DROPDOWN SECTIONS */
.dropdown-header {
  cursor: pointer;
  background: #eef3ff;
  padding: 12px;
  border-radius: 6px;
  font-weight: bold;
}

.dropdown-content {
  display: none;
  margin-top: 12px;
}

.dropdown.open .dropdown-content {
  display: block;
}

/* IMAGE ROW */
.image-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.image-row img {
  width: 30%;
  max-width: 250px;
}

/* QUESTIONS */
.question-box {
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}

.question-box.viewed {
  background: #d4edda;
}

/* ADMIN TEXT EDITING */
.editable {
  border: 1px dashed #aaa;
  padding: 10px;
  min-height: 60px;
}

/* FORMAT TOOLBAR */
.format-bar button {
  margin-right: 6px;
  padding: 6px 10px;
  font-size: 14px;
}

/* INTERACTIVE COUNTER */
#impact-counter {
  text-align: center;
  background: #eaf1ff;
  padding: 20px;
  border-radius: 8px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <img id="logo" alt="Organization Logo">
    <div>
      <h1 id="title"></h1>
      <p id="org-text"></p>
    </div>
  </div>
</header>

<div id="top-images" class="image-row"></div>

<section class="dropdown">
  <div class="dropdown-header" onclick="toggleDropdown(this)">Our Mission</div>
  <div class="dropdown-content">
    <p id="mission"></p>
  </div>
</section>

<section class="dropdown">
  <div class="dropdown-header" onclick="toggleDropdown(this)">Why Oral Health Matters</div>
  <div class="dropdown-content">
    <p id="why"></p>
  </div>
</section>

<section>
<h2>Donate</h2>
<p id="donate-text"></p>
<a id="donate-button" href="#" target="_blank">
  <button class="button">Donate Now</button>
</a>
</section>

<section id="impact-counter">
  <h2>Smiles Impacted</h2>
  <p id="count">0</p>
  <button class="button" onclick="increaseCount()">Add a Smile</button>
</section>

<section>
<h2>Have questions? Let us know!</h2>
<input id="q-name" placeholder="Name (Optional)">
<input id="q-email" placeholder="Your email">
<textarea id="q-text" placeholder="Your question"></textarea>
<button class="button" onclick="submitQuestion()">Send Question</button>
</section>

<div id="bottom-images" class="image-row"></div>

<div id="admin-area" class="hidden">
<section>
<h3>Admin Panel</h3>

<div class="format-bar">
  <button onclick="format('bold')">Bold</button>
  <button onclick="format('italic')">Italic</button>
  <button onclick="format('underline')">Underline</button>
</div>

<label>Donate Button Link</label>
<input id="donate-link-input">

<button class="button" onclick="saveChanges()">Save Changes</button>
</section>
</div>

<footer>
<p>© 2025 Smile Forward</p>
<span id="admin-link" onclick="adminLogin()">admin</span>
</footer>

<script>
const PASSWORD = "admin123";

const DEFAULT_CONTENT = {
  title: "Restoring Smiles with Smile Forward",
  orgText: "A student based Non-Profit organization based in Mississauga promoting oral health awareness",
  mission: "For many people, brushing their teeth is a simple daily habit...",
  why: "Oral health is far more than just a bright smile...",
  donate: "Your support plays a vital role..."
};

function loadText(id,key){
  document.getElementById(id).innerHTML = localStorage.getItem(key) || DEFAULT_CONTENT[key];
}

window.onload=()=>{
  loadText("title","title");
  loadText("org-text","orgText");
  loadText("mission","mission");
  loadText("why","why");
  loadText("donate-text","donate");
  document.getElementById("donate-button").href = localStorage.getItem("donateLink") || "#";
};

function adminLogin(){
  if(prompt("Password")===PASSWORD){
    document.getElementById("admin-area").classList.remove("hidden");
    ["title","org-text","mission","why","donate-text"].forEach(id=>{
      const el=document.getElementById(id);
      el.contentEditable=true;
      el.classList.add("editable");
    });
  }
}

function saveChanges(){
  ["title","org-text","mission","why","donate-text"].forEach(id=>{
    localStorage.setItem(id,document.getElementById(id).innerHTML);
    document.getElementById(id).contentEditable=false;
  });
  const link=document.getElementById("donate-link-input").value;
  if(link){
    localStorage.setItem("donateLink",link);
    document.getElementById("donate-button").href=link;
  }
  location.reload();
}

function format(cmd){document.execCommand(cmd,false,null);}

function toggleDropdown(el){
  el.parentElement.classList.toggle("open");
}

let count=0;
function increaseCount(){
  count++;
  document.getElementById("count").innerText=count;
}
</script>

</body>
</html>
