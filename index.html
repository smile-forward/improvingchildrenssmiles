<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restoring Smiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* ================== ABSOLUTE TEXT VISIBILITY FIX ================== */
* {
  text-overflow: clip !important;
  -webkit-line-clamp: unset !important;
  -webkit-box-orient: vertical !important;
}

p, h1, h2, h3, h4, h5, h6, div, span, section {
  white-space: normal !important;
  overflow: visible !important;
  max-height: none !important;
}

/* Ensure editable text NEVER truncates */
[contenteditable="true"] {
  white-space: normal !important;
  overflow: visible !important;
  max-height: none !important;
}

/* ================================================================ */

body {
  font-family: "Times New Roman", serif;
  margin: 0;
  background: #f9f9f9;
  color: #333;
  font-size: 18px;
  line-height: 1.9;
}

header {
  background: #cfe2ff;
  padding: 40px 20px;
}

.header-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  text-align: center;
}

#logo {
  height: 90px;
  display: none;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 25px 15px;
}

.button {
  background: #5c86cb;
  color: white;
  padding: 14px 26px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

.hidden { display: none; }

textarea, input, select {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  font-family: "Times New Roman", serif;
  font-size: 16px;
}

/* DROPDOWNS — NO HEIGHT LIMITS */
.dropdown-header {
  cursor: pointer;
  background: #eef3ff;
  padding: 14px;
  border-radius: 6px;
  font-weight: bold;
}

.dropdown-content {
  display: none;
  padding-top: 15px;
}

/* IMAGES */
.image-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.image-row img {
  width: 30%;
  max-width: 250px;
  border-radius: 6px;
}

/* ADMIN */
.editable {
  border: 1px dashed #aaa;
  padding: 10px;
}

.format-bar button {
  margin-right: 6px;
  padding: 6px 10px;
}

/* FOOTER */
footer {
  background: #eee;
  text-align: center;
  padding: 10px;
  font-size: 12px;
}

#admin-link {
  font-size: 11px;
  color: #999;
  cursor: pointer;
}

/* MOBILE */
@media (max-width: 768px) {
  .header-wrap { flex-direction: column; }
  .image-row img { width: 90%; }
}

</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <img id="logo" alt="Organization Logo">
    <div>
      <h1 id="title"></h1>
      <p id="org-text"></p>
    </div>
  </div>
</header>

<section class="dropdown">
  <div class="dropdown-header" onclick="toggleDropdown(this)">Our Mission</div>
  <div class="dropdown-content">
    <p id="mission"></p>
    <div id="mission-images" class="image-row"></div>
  </div>
</section>

<section class="dropdown">
  <div class="dropdown-header" onclick="toggleDropdown(this)">Why Oral Health Matters</div>
  <div class="dropdown-content">
    <p id="why"></p>
    <div id="why-images" class="image-row"></div>
  </div>
</section>

<section>
<h2>Donate</h2>
<p id="donate-text"></p>
<a href="https://gofund.me/9b7a69e30" target="_blank">
  <button class="button">Donate Now</button>
</a>
</section>

<section>
<h2>Have questions? Let us know!</h2>
<input id="q-name" placeholder="Name (Optional)">
<input id="q-email" placeholder="Your email">
<textarea id="q-text" placeholder="Your question"></textarea>
<button class="button" onclick="submitQuestion()">Send Question</button>
</section>

<div id="admin-area" class="hidden">
<section>
<h3>Admin Panel</h3>

<div class="format-bar">
  <button onclick="format('bold')">Bold</button>
  <button onclick="format('italic')">Italic</button>
  <button onclick="format('underline')">Underline</button>
</div>

<button class="button" onclick="saveChanges()">Save Changes</button>
</section>
</div>

<footer>
<p>© 2025 Smile Forward</p>
<span id="admin-link" onclick="adminLogin()">admin</span>
</footer>

<script>
const PASSWORD="admin123";

const DEFAULT_CONTENT={
title:"Restoring Smiles with Smile Forward",
orgText:"A student based Non-Profit organization based in Mississauga promoting oral health awareness",
mission:"For many people, brushing their teeth is a simple daily habit—something done almost automatically...",
why:"Oral health is far more than just a bright smile—it is a critical component of overall health.",
donate:"Your support plays a vital role in restoring dignity and improving health."
};

function loadText(id,key){
  document.getElementById(id).innerHTML =
    localStorage.getItem(key) || DEFAULT_CONTENT[key];
}

window.onload=()=>{
  loadText("title","title");
  loadText("org-text","orgText");
  loadText("mission","mission");
  loadText("why","why");
  loadText("donate-text","donate");
};

function toggleDropdown(el){
  const content = el.nextElementSibling;
  content.style.display =
    content.style.display === "block" ? "none" : "block";
}

function adminLogin(){
  if(prompt("Password")===PASSWORD){
    document.getElementById("admin-area").classList.remove("hidden");
    ["title","org-text","mission","why","donate-text"].forEach(id=>{
      const el=document.getElementById(id);
      el.contentEditable=true;
      el.classList.add("editable");
    });
  }
}

function saveChanges(){
  ["title","org-text","mission","why","donate-text"].forEach(id=>{
    localStorage.setItem(id,document.getElementById(id).innerHTML);
  });
  location.reload();
}

function format(cmd){ document.execCommand(cmd,false,null); }

function submitQuestion(){ alert("Question sent!"); }
</script>

</body>
</html>

</body>
</html>
